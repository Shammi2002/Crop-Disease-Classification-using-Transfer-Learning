name: Build and Deploy to Cloud Run

# Trigger: runs automatically on every push to main,
# and can also be run manually from the GitHub Actions tab
on:
  push:
    branches: [main]
  workflow_dispatch:
  repository_dispatch:
    types: [model-updated]

env:
  PROJECT_ID: my-project-imageclassifier
  BUCKET_NAME: shammi0228-crop-disease-model
  MODEL_FILE: plant_disease_model.keras
  DOCKERHUB_REPO: shammi0228/image_classifier
  CLOUD_RUN_SERVICE: image-classifier
  REGION: us-central1

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Get your repo's code onto the runner
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Authenticate to Google Cloud using the service account key
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      # 3. Set up the gcloud CLI on the runner
      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.PROJECT_ID }}

      # 4. Download the model file from Cloud Storage into app/
      - name: Download model from Cloud Storage
        run: |
          gcloud storage cp gs://${{ env.BUCKET_NAME }}/${{ env.MODEL_FILE }} app/${{ env.MODEL_FILE }}

      # 5. Log in to Docker Hub
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 6. Build the Docker image, tagged with the short commit SHA for a unique version each run
      - name: Build Docker image
        run: |
          docker build -t ${{ env.DOCKERHUB_REPO }}:${{ github.sha }} .
          docker tag ${{ env.DOCKERHUB_REPO }}:${{ github.sha }} ${{ env.DOCKERHUB_REPO }}:latest

      # 7. Push both tags to Docker Hub
      - name: Push image to Docker Hub
        run: |
          docker push ${{ env.DOCKERHUB_REPO }}:${{ github.sha }}
          docker push ${{ env.DOCKERHUB_REPO }}:latest

      # 8. Deploy the newly pushed image to Cloud Run
      - name: Deploy to Cloud Run
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ env.CLOUD_RUN_SERVICE }}
          region: ${{ env.REGION }}
          image: docker.io/${{ env.DOCKERHUB_REPO }}:${{ github.sha }}
          flags: "--allow-unauthenticated --port=8080 --memory=2Gi"
