<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Crop Disease Detection</title>
<style>
  :root {
    --green:#2e7d32;
    --green-dark:#1b5e20;
    --green-light:#e8f5e9;
    --amber:#ef6c00;
    --amber-light:#fff3e0;
    --red:#c62828;
    --red-light:#fdecea;
    --grey:#607d8b;
    --grey-light:#eceff1;
    --ink:#1f2a1f;
    --muted:#6b7a6b;
    --border:#dfe7df;
  }
  * { box-sizing: border-box; }
  body {
    font-family: "Segoe UI", Arial, sans-serif;
    background: linear-gradient(180deg, #f3f7f3 0%, #eef4ee 100%);
    margin: 0;
    padding: 24px 16px 48px;
    color: var(--ink);
  }
  .wrap { max-width: 560px; margin: 0 auto; }

  header { text-align: center; margin-bottom: 20px; }
  header h1 {
    color: var(--green-dark);
    font-size: 24px;
    margin: 0 0 4px;
    letter-spacing: 0.2px;
  }
  header p {
    margin: 0;
    color: var(--muted);
    font-size: 14px;
  }

  .card {
    background: #fff;
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 20px;
    margin-top: 16px;
    box-shadow: 0 2px 10px rgba(30, 60, 30, 0.06);
  }

  /* ---- Upload area ---- */
  .drop {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 8px;
    border: 2px dashed #a5d6a7;
    border-radius: 12px;
    padding: 32px 16px;
    text-align: center;
    cursor: pointer;
    color: var(--muted);
    transition: background 0.15s ease, border-color 0.15s ease;
  }
  .drop:hover { border-color: var(--green); }
  .drop.drag { background: var(--green-light); border-color: var(--green); }
  .drop .icon { font-size: 28px; line-height: 1; }
  .drop .main-text { font-size: 15px; color: var(--ink); font-weight: 600; }
  .drop .sub-text { font-size: 12px; color: var(--muted); }

  #preview {
    max-width: 100%;
    max-height: 280px;
    display: none;
    margin: 16px auto 0;
    border-radius: 10px;
    border: 1px solid var(--border);
  }

  button#predictBtn {
    width: 100%;
    padding: 13px;
    font-size: 16px;
    font-weight: 600;
    margin-top: 16px;
    border: 0;
    border-radius: 10px;
    background: var(--green);
    color: #fff;
    cursor: pointer;
    transition: background 0.15s ease;
  }
  button#predictBtn:hover:not(:disabled) { background: var(--green-dark); }
  button#predictBtn:disabled { background: #b9c4b9; cursor: not-allowed; }

  /* ---- Result card ---- */
  .badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 5px 14px;
    border-radius: 20px;
    color: #fff;
    font-size: 12px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.4px;
  }

  .result-title {
    margin: 14px 0 4px;
    font-size: 18px;
    font-weight: 700;
    color: var(--ink);
  }

  .bar {
    background: var(--grey-light);
    border-radius: 6px;
    height: 10px;
    margin: 10px 0 6px;
    overflow: hidden;
  }
  .bar > div { height: 100%; border-radius: 6px; transition: width 0.3s ease; }

  .confidence-row {
    display: flex;
    justify-content: space-between;
    font-size: 12px;
    color: var(--muted);
    margin-bottom: 4px;
  }

  h3.section-title {
    margin: 20px 0 8px;
    font-size: 13px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.4px;
    color: var(--green-dark);
    border-bottom: 1px solid var(--border);
    padding-bottom: 6px;
  }
  .text {
    white-space: pre-line;
    line-height: 1.55;
    font-size: 14px;
    margin: 0;
  }
  .small {
    font-size: 12px;
    color: var(--muted);
    margin-top: 10px;
    line-height: 1.5;
  }
  .notice-box {
    background: var(--grey-light);
    border-radius: 10px;
    padding: 14px;
    font-size: 14px;
    line-height: 1.55;
  }
  .notice-box.amber { background: var(--amber-light); }

  /* ---- Top-3 list ---- */
  .top3-list { display: flex; flex-direction: column; gap: 6px; }
  .top3-row {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 13px;
  }
  .top3-row .top3-name {
    flex: 1 1 auto;
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    color: var(--ink);
  }
  .top3-row .top3-pct {
    flex: 0 0 auto;
    width: 48px;
    text-align: right;
    color: var(--muted);
    font-variant-numeric: tabular-nums;
  }
  .top3-row .top3-bar {
    flex: 0 0 72px;
    height: 6px;
    background: var(--grey-light);
    border-radius: 4px;
    overflow: hidden;
  }
  .top3-row .top3-bar > div {
    height: 100%;
    background: #b0bec5;
    border-radius: 4px;
  }

  .error {
    color: var(--red);
    background: var(--red-light);
    border-radius: 10px;
    padding: 14px;
    font-size: 14px;
  }

  .spinner-row {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    color: var(--muted);
    font-size: 14px;
    padding: 6px 0;
  }
  .spin {
    width: 18px;
    height: 18px;
    border: 2.5px solid var(--border);
    border-top-color: var(--green);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    flex: 0 0 auto;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Crop Disease Detection</h1>
    <p>Upload a leaf photo to check for disease and get care guidance</p>
  </header>

  <div class="card">
    <label class="drop" id="drop">
      <input type="file" id="imageInput" accept="image/*" hidden>
      <span class="icon">🌿</span>
      <span class="main-text">Tap or drag a leaf photo here</span>
      <span class="sub-text">JPG or PNG, one leaf, clear lighting</span>
    </label>
    <img id="preview" alt="Selected leaf">
    <button id="predictBtn" disabled>Analyze</button>
  </div>

  <div id="result"></div>
</div>

<script>
  const API_URL = "/predict";
  const input = document.getElementById("imageInput");
  const drop = document.getElementById("drop");
  const preview = document.getElementById("preview");
  const btn = document.getElementById("predictBtn");
  const result = document.getElementById("result");
  let selectedFile = null;

  function setFile(file) {
    if (!file || !file.type.startsWith("image/")) return;
    selectedFile = file;
    preview.src = URL.createObjectURL(file);
    preview.style.display = "block";
    btn.disabled = false;
  }

  input.addEventListener("change", () => setFile(input.files[0]));
  ["dragover", "dragenter"].forEach(e => drop.addEventListener(e, ev => { ev.preventDefault(); drop.classList.add("drag"); }));
  ["dragleave", "drop"].forEach(e => drop.addEventListener(e, ev => { ev.preventDefault(); drop.classList.remove("drag"); }));
  drop.addEventListener("drop", ev => setFile(ev.dataTransfer.files[0]));

  function el(tag, text, cls) {
    const e = document.createElement(tag);
    if (text !== undefined && text !== null) e.textContent = text;
    if (cls) e.className = cls;
    return e;
  }

  function section(card, title, body) {
    card.appendChild(el("h3", title, "section-title"));
    card.appendChild(el("p", body, "text"));
  }

  const STATUS = {
    diseased:  { label: "Disease detected", color: "var(--red)" },
    healthy:   { label: "Healthy",          color: "var(--green)" },
    uncertain: { label: "Uncertain",        color: "var(--amber)" },
    no_leaf:   { label: "No leaf found",    color: "var(--grey)" }
  };

  function prettifyClassName(name) {
    return name.replace(/___/g, " - ").replace(/_/g, " ");
  }

  function render(d) {
    result.replaceChildren();
    const card = el("div", null, "card");
    const s = STATUS[d.status] || STATUS.uncertain;

    const badge = el("span", s.label, "badge");
    badge.style.background = s.color;
    card.appendChild(badge);

    if (d.status === "no_leaf") {
      const box = el("div", null, "notice-box");
      box.appendChild(el("div", "No leaf detected. Please upload a clear, close-up photo of a single leaf."));
      card.appendChild(box);
    } else if (d.status === "uncertain") {
      const box = el("div", null, "notice-box amber");
      box.appendChild(el("div", "We are not sure about this image. Try a clearer, well-lit photo of one leaf, or consult your local agricultural extension officer. No treatment is suggested because the result is not reliable."));
      card.appendChild(box);
    } else {
      card.appendChild(el("div", d.crop ? `${d.crop} - ${d.disease}` : d.disease, "result-title"));

      const confRow = el("div", null, "confidence-row");
      confRow.appendChild(el("span", "Confidence"));
      confRow.appendChild(el("span", `${d.confidence_percentage}%`));
      card.appendChild(confRow);

      const bar = el("div", null, "bar");
      const fill = document.createElement("div");
      fill.style.width = d.confidence_percentage + "%";
      fill.style.background = s.color;
      bar.appendChild(fill);
      card.appendChild(bar);

      if (d.status === "healthy") {
        const box = el("div", null, "notice-box");
        box.appendChild(el("div", "This leaf looks healthy. No treatment is needed."));
        card.appendChild(box);
      } else {
        section(card, "Symptoms", d.symptoms);
        section(card, "Management", d.management);
        if (d.source) card.appendChild(el("div", "Source: " + d.source, "small"));
        card.appendChild(el("div", "Confirm pesticide choice and dosage with your local agricultural extension officer before use.", "small"));
      }
    }

    if (d.top3 && d.top3.length) {
      card.appendChild(el("h3", "Other possibilities", "section-title"));
      const list = el("div", null, "top3-list");
      d.top3.forEach(t => {
        const row = el("div", null, "top3-row");
        row.appendChild(el("span", prettifyClassName(t.class_name), "top3-name"));
        const miniBar = el("span", null, "top3-bar");
        const miniFill = document.createElement("div");
        miniFill.style.width = t.confidence_percentage + "%";
        miniBar.appendChild(miniFill);
        row.appendChild(miniBar);
        row.appendChild(el("span", t.confidence_percentage + "%", "top3-pct"));
        list.appendChild(row);
      });
      card.appendChild(list);
    }
    result.appendChild(card);
  }

  btn.addEventListener("click", async () => {
    if (!selectedFile) return;
    btn.disabled = true;

    const loadingCard = el("div", null, "card");
    const spinnerRow = el("div", null, "spinner-row");
    spinnerRow.appendChild(el("div", null, "spin"));
    spinnerRow.appendChild(el("span", "Analyzing image... (first request can take 20-30 seconds)"));
    loadingCard.appendChild(spinnerRow);
    result.replaceChildren(loadingCard);

    const fd = new FormData();
    fd.append("file", selectedFile);
    try {
      const res = await fetch(API_URL, { method: "POST", body: fd });
      if (!res.ok) {
        let msg = `Server responded with status ${res.status}`;
        try { msg = (await res.json()).detail || msg; } catch (_) {}
        throw new Error(msg);
      }
      render(await res.json());
    } catch (err) {
      const errCard = el("div", null, "card");
      errCard.appendChild(el("div", "Error: " + err.message, "error"));
      result.replaceChildren(errCard);
    } finally {
      btn.disabled = false;
    }
  });
</script>
</body>
</html>
